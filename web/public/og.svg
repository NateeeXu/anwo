<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="安窝 Anwo — 安心落脚，从校园开始。Settle in safely, starting at campus.">
  <!-- Social card. Static palette (light theme) because previews cannot resolve CSS variables. -->
  <rect width="1200" height="630" fill="#FBF8F3"/>
  <!-- faint map grid in the background -->
  <g stroke="#E7E0D5" stroke-width="2">
    <path d="M0 160 H1200 M0 320 H1200 M0 480 H1200 M240 0 V630 M480 0 V630 M720 0 V630 M960 0 V630"/>
  </g>
  <path d="M-40 560 C 200 520, 360 600, 620 540 S 1000 470, 1240 520" fill="none" stroke="#CFC6B8" stroke-width="8" stroke-linecap="round"/>
  <!-- price pins (signature element) -->
  <g font-family="Inter, 'Noto Sans SC', system-ui, sans-serif" font-size="22" font-weight="600" text-anchor="middle">
    <g transform="translate(860 150)">
      <rect x="-6" y="16" width="12" height="12" fill="#FFFFFF" stroke="#1C1917" stroke-width="2.5" transform="rotate(45)"/>
      <rect x="-62" y="-22" width="124" height="44" rx="22" fill="#FFFFFF" stroke="#1C1917" stroke-width="2.5"/>
      <text y="8" fill="#1C1917">$1,250</text>
    </g>
    <g transform="translate(1010 250)">
      <rect x="-6" y="16" width="12" height="12" fill="#C2410C" transform="rotate(45)"/>
      <rect x="-56" y="-22" width="112" height="44" rx="22" fill="#C2410C" stroke="#C2410C" stroke-width="2.5"/>
      <text y="8" fill="#FFFFFF">$980</text>
    </g>
    <g transform="translate(930 420)">
      <rect x="-6" y="16" width="12" height="12" fill="#FFFFFF" stroke="#1C1917" stroke-width="2.5" transform="rotate(45)"/>
      <rect x="-62" y="-22" width="124" height="44" rx="22" fill="#FFFFFF" stroke="#1C1917" stroke-width="2.5"/>
      <text y="8" fill="#1C1917">$1,400</text>
    </g>
    <g transform="translate(1080 500)">
      <circle r="22" fill="#1C1917" stroke="#FFFFFF" stroke-width="3"/>
      <text y="8" fill="#FBF8F3" font-size="18">12</text>
    </g>
  </g>
  <!-- lockup -->
  <g transform="translate(96 150) scale(4)">
    <g fill="none">
      <path d="M6 15 L16 7 L26 15" stroke="#1C1917" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M16 3.5 V6" stroke="#1C1917" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="16" cy="20" r="5.5" fill="#E35A2B"/>
      <path d="M16 25.5 V28.5" stroke="#E35A2B" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="38" y="22" font-family="Inter, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="19" font-weight="700" letter-spacing="-0.01em" fill="#1C1917">安窝</text>
    <text x="80" y="22" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif" font-size="17" font-weight="600" letter-spacing="-0.02em" fill="#57514A">Anwo</text>
  </g>
  <!-- taglines -->
  <text x="96" y="372" font-family="Inter, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="52" font-weight="700" letter-spacing="-0.02em" fill="#1C1917">安心落脚，从校园开始。</text>
  <text x="96" y="432" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif" font-size="34" font-weight="500" letter-spacing="-0.01em" fill="#57514A">Settle in safely, starting at campus.</text>
  <!-- footer facts -->
  <g font-family="Inter, 'Noto Sans SC', system-ui, sans-serif" font-size="22" font-weight="500" fill="#6F6861">
    <text x="96" y="540">转租 Sublets · 求租 Wanted · 二手 Market · 搭子 Buddies · 校车 Shuttle · 地图 Map</text>
  </g>
  <rect x="96" y="470" width="72" height="4" rx="2" fill="#E35A2B"/>
</svg>
