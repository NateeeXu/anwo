<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 安窝 Anwo mark on a rounded paper plate. Follows the OS color scheme; favicon-dark.svg is the explicit dark variant. -->
  <style>
    svg { --plate: #FBF8F3; --ink: #1C1917; }
    @media (prefers-color-scheme: dark) { svg { --plate: #141210; --ink: #F2EDE6; } }
  </style>
  <rect width="32" height="32" rx="6" fill="var(--plate)"/>
  <path d="M6 15 L16 7 L26 15" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M16 3.5 V6" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="16" cy="20" r="5.5" fill="#E35A2B"/>
  <path d="M16 25.5 V28.5" stroke="#E35A2B" stroke-width="2.5" stroke-linecap="round"/>
</svg>
